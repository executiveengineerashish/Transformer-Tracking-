<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <meta name="theme-color" content="#ff3b00">

  <title>Transformer Tracking</title>

  <link rel="stylesheet" href="./style.css?v=500">
</head>

<body>

<header class="top-header">

  <div class="header-icon">⚡</div>

  <div>
    <h1>Transformer Tracking</h1>
    <div class="header-subtitle">
      PR / Complaint Search
    </div>
  </div>

</header>


<main class="main-container">

  <section class="search-card">

    <label class="search-label">
      PR / Complaint Number
    </label>

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Enter PR / Complaint Number"
      >

      <button id="searchBtn" type="button">
        SEARCH
      </button>

    </div>

    <div id="searchStatus"
         class="search-status loading">
      Loading transformer records...
    </div>

  </section>


  <section id="results"
           class="results">
  </section>

</main>


<footer class="footer">
  Transformer Tracking
</footer>


<script src="./app.js?v=500"></script>

</body>
</html>
