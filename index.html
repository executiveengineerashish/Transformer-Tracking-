<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Transformer Tracking</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="topbar">
    <div class="app-title">⚡ Transformer Tracking</div>
    <div class="app-subtitle">PR / Complaint Search</div>
  </div>

  <div class="search-section">

    <label for="searchInput">PR / Complaint Number</label>

    <div class="search-box">
      <span class="search-icon">🔎</span>

      <input
        id="searchInput"
        type="search"
        inputmode="text"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Enter PR or Complaint Number"
      >

      <button id="clearBtn" type="button">✕</button>
    </div>

    <div id="searchStatus" class="search-status">
      Loading transformer records...
    </div>

  </div>

  <div id="results"></div>

</div>

<script src="app.js"></script>

</body>
</html>
