<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PR Search</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>


<body>

  <div class="app">

    <!-- HEADER -->

    <header class="topbar">

      <div class="title">

        <h1>PR Search</h1>

        <p
          class="subtitle"
          id="subtitle"
        >
          Loading PR Search…
        </p>

      </div>


      <button
        class="refreshBtn"
        id="refreshBtn"
        type="button"
        aria-label="Refresh"
      >
        ↻
      </button>

    </header>


    <!-- SEARCH -->

    <section class="searchPanel">

      <label class="searchLabel">
        PR / Complaint Number
      </label>


      <input
        id="q"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter PR / Complaint Number"
      >


      <button
        class="searchBtn"
        id="searchBtn"
        type="button"
      >
        PR/Complaint Number
      </button>

    </section>


    <!-- ERROR -->

    <div
      class="error"
      id="error"
      style="display:none"
    ></div>


    <!-- RESULTS -->

    <section class="resultsPanel">

      <div
        class="resultsSummary"
        id="resultsSummary"
      >
        Enter PR / Complaint Number to search.
      </div>


      <div
        class="pager"
        id="pager"
        style="display:none"
      >

        <button
          class="pageBtn"
          id="prevBtn"
          type="button"
          disabled
        >
          Prev
        </button>


        <button
          class="pageBtn"
          id="nextBtn"
          type="button"
          disabled
        >
          Next
        </button>

      </div>


      <!-- MOBILE RESULTS -->

      <div
        id="mobileResults"
        class="mobileResults"
      ></div>


      <!-- DESKTOP TABLE -->

      <div
        id="tableWrap"
        class="tableWrap"
        style="display:none"
      >

        <table>

          <thead id="thead"></thead>

          <tbody id="tbody"></tbody>

        </table>

      </div>

    </section>


  </div>


  <script
    type="module"
    src="./app.js"
  ></script>

</body>

</html>
