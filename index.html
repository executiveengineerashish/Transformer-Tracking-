<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ff3b00">
<title>Transformer Tracking</title>
<link rel="stylesheet" href="./style.css?v=902">
</head>

<body>

<header class="top-header">
  <div class="header-icon">⚡</div>

  <div>
    <h1>Transformer Tracking</h1>
    <div class="header-subtitle">PR / Complaint Search</div>
  </div>
</header>

<main class="main-container">

<section class="dashboard-card">

  <div class="dashboard-title">
    📊 Transformer Monitoring Dashboard
  </div>

  <div class="dashboard-month" id="dashboardMonth">
    Loading...
  </div>

  <div class="summary-grid">

    <button class="summary-box total"
      data-action="status"
      data-value="ALL">

      <span>Total PR</span>
      <strong id="dashTotal">0</strong>

    </button>


    <button class="summary-box issued"
      data-action="status"
      data-value="ISSUED">

      <span>Issued</span>
      <strong id="dashIssued">0</strong>

    </button>


    <button class="summary-box pending"
      data-action="status"
      data-value="PENDING_ISSUE">

      <span>Pending Issue</span>
      <strong id="dashPending">0</strong>

    </button>


    <button class="summary-box replacement"
      data-action="status"
      data-value="REPLACEMENT_PENDING">

      <span>Replacement Pending</span>
      <strong id="dashReplacement">0</strong>

    </button>


    <button class="summary-box return"
      data-action="status"
      data-value="RETURN_PENDING">

      <span>TX Return Pending</span>
      <strong id="dashReturn">0</strong>

    </button>

  </div>


  <div class="action-title">
    ⚠️ Today's Action
  </div>


  <div class="mini-grid">

    <button class="mini-box"
      data-action="age"
      data-value="24">

      Issue &gt; 24 Hours
      <b id="age24">0</b>

    </button>


    <button class="mini-box"
      data-action="age"
      data-value="72">

      Issue &gt; 72 Hours
      <b id="age72">0</b>

    </button>

      data-action="age"
      data
