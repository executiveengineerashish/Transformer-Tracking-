<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transformer Tracking</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="app-header">
      <div class="header-title">⚡ Transformer Tracking</div>
      <div class="header-subtitle">PR / Complaint Search</div>
    </header>

    <main class="container">

      <div class="search-box">

        <label for="searchInput">
          PR / Complaint Number
        </label>

        <div class="search-row">

          <input
            type="text"
            id="searchInput"
            placeholder="Enter PR or Complaint Number"
            autocomplete="off"
          >

          <button id="searchBtn">
            SEARCH
          </button>

        </div>

        <div id="searchStatus" class="search-status">
          Enter PR / Complaint Number to search.
        </div>

      </div>


      <div id="results"></div>

    </main>

    <footer>
      Transformer Tracking
    </footer>

  </div>

  <script src="app.js"></script>

</body>
</html>
