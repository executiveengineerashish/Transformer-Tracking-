<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <meta name="theme-color" content="#f57c00" />

  <title>PR Search</title>

  <link rel="stylesheet" href="./style.css" />
</head>


<body>

  <div class="app">

    <!-- =========================
         HEADER
         ========================= -->

    <header class="topbar">

      <div class="title">

        <h1>PR Search</h1>

        <p
          class="subtitle"
          id="subtitle"
        >
          Loading PR Search…
        </p>

      </div>


      <div class="topActions">

        <button
          class="secondary refreshIcon"
          id="refreshBtn"
          type="button"
          aria-label="Refresh"
        >
          ↻
        </button>

      </div>

    </header>


    <!-- =========================
         SEARCH
         ========================= -->

    <section class="panel searchPanel">

      <label class="field">

        <span class="label">
          PR / Complaint Number
        </span>


        <input
          id="q"
          type="search"
          inputmode="text"
          autocomplete="off"
          placeholder="Enter PR / Complaint Number"
        />

      </label>


      <button
        class="primary searchBtn"
        id="searchBtn"
        type="button"
      >
        PR/Complaint Number
      </button>

    </section>


    <!-- =========================
         RESULTS
         ========================= -->

    <section class="results">

      <div class="resultsTop">

        <div
          class="resultsSummary"
          id="resultsSummary"
        >
          Loading data…
        </div>


        <div class="pager">

          <button
            class="secondary"
            id="prevBtn"
            type="button"
            disabled
          >
            Prev
          </button>


          <button
            class="secondary"
            id="nextBtn"
            type="button"
            disabled
          >
            Next
          </button>

        </div>

      </div>


      <!-- =========================
           MOBILE RESULTS
           ========================= -->

      <div
        class="mobileResults"
        id="mobileResults"
      ></div>


      <!-- =========================
           DESKTOP RESULTS
           ========================= -->

      <div
        class="tableWrap"
        id="tableWrap"
        style="display:none"
      >

        <table id="table">

          <thead id="thead"></thead>

          <tbody id="tbody"></tbody>

        </table>

      </div>

    </section>


    <!-- ERROR -->

    <div
      class="error"
      id="error"
      style="display:none"
    ></div>

  </div>


  <script
    type="module"
    src="./app.js"
  ></script>

</body>

</html>
