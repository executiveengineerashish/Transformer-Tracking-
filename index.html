<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>PR Search</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="top">
    <div class="title">PR Search</div>
    <div class="sub" id="status">Connecting to PR SEARCH...</div>
  </header>

  <main>

    <section class="searchBox">
      <label>PR / Complaint Number</label>

      <div class="searchRow">
        <input
          id="searchInput"
          type="search"
          inputmode="numeric"
          placeholder="Enter PR / Complaint Number"
          autocomplete="off"
        >
        <button id="searchBtn">SEARCH</button>
      </div>

      <div class="hint">
        Search works across all columns
      </div>
    </section>

    <section id="message" class="message">
      Enter PR / Complaint Number to search.
    </section>

    <section id="results"></section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
