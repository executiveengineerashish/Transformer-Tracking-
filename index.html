<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Transformer Tracking</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="top-header">
    <div class="title">⚡ Transformer Tracking</div>
    <div class="subtitle">PR / Complaint Search</div>
  </header>

  <main>

    <section class="search-panel">

      <label>PR / Complaint Number</label>

      <div class="search-line">

        <input
          id="searchInput"
          type="text"
          inputmode="numeric"
          placeholder="Enter PR / Complaint Number"
          autocomplete="off"
        >

        <button id="searchBtn">SEARCH</button>

      </div>

      <div id="searchStatus">
        Enter PR / Complaint Number to search.
      </div>

    </section>

    <div id="results"></div>

  </main>

  <footer>
    Transformer Tracking
  </footer>

</div>

<script src="app.js"></script>

</body>
</html>
